<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Giriş</title>

    <!-- Font olarak Outfit kullandım, arayüze daha modern bir hava katıyor -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- İkon paketi olarak Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Ana stil dosyamız -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Bu sayfaya özel, yapıyı ortalamak ve formu şekillendirmek için yazdığım stiller -->
    <style>
        :root {
            --bg-light: #f3f4f6;
            --bg-dark: #111827;
            --text-light: #1f2937;
            --text-dark: #f9fafb;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --glass-bg-light: rgba(255, 255, 255, 0.7);
            --glass-bg-dark: rgba(31, 41, 55, 0.7);
            --border-light: rgba(255, 255, 255, 0.3);
            --border-dark: rgba(255, 255, 255, 0.1);
        }

        /* Sayfayı tamamen kaplayıp kartı tam ortaya hizalamak için flex kullandım */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-light);
            transition: background-color 0.3s ease;
        }

        body:not(.light-mode) {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Aşağıdan yukarı doğru yumuşakça beliren giriş kartı animasyonu */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-container {
            text-align: center;
            padding: 40px 30px;
            border-radius: 20px;
            animation: fadeUp 0.5s ease-out forwards;
        }

        /* Cam efekti (Glassmorphism) arka planı */
        .glass {
            background: var(--glass-bg-light);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-light);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        body:not(.light-mode) .glass {
            background: var(--glass-bg-dark);
            border-color: var(--border-dark);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .top-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .logo h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
        }

        /* Input kutularının tasarımı */
        .auth-form input {
            background: transparent;
            border: 1px solid #ccc;
            padding: 14px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: inherit;
            outline: none;
            transition: all 0.2s;
        }

        body:not(.light-mode) .auth-form input {
            border-color: #4b5563;
        }

        /* İnputa tıklandığında (focus) etrafında çıkan mavi çerçeve */
        .auth-form input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* Alt kısımdaki Kayıt Ol / Giriş Yap geçiş linkinin tasarımı */
        .toggle-text {
            margin-top: 24px;
            color: #6b7280;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s;
        }

        body:not(.light-mode) .toggle-text {
            color: #9ca3af;
        }

        .toggle-text:hover {
            color: var(--primary);
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        /* Sağ alttaki bildirim (toast) için temel CSS */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 50;
        }

        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            background: white;
            color: #111827;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body class="light-mode">

    <div class="app-container">
        <!-- Üst logo kısmı -->
        <header class="top-bar">
            <div class="logo">
                <i class="ph-fill ph-check-square-offset"></i>
                <h1>TaskFlow</h1>
            </div>
        </header>

        <!-- Cam efektli (glassmorphism) ana form kartımız -->
        <div class="auth-container glass">
            <h2 id="form-title">Giriş Yap</h2>
            <p style="color: #6b7280; font-size: 0.9rem; margin: 0;">Görevlerini organize et</p>

            <form id="auth-form" class="auth-form">
                <!-- Tarayıcının kendi kendine tamamlama yapmasını engellemek için autocomplete="off" ekledim -->
                <input type="text" id="username" placeholder="Kullanıcı Adı" required autocomplete="off">
                <input type="password" id="password" placeholder="Şifre" required>

                <button type="submit" class="btn-primary" id="submit-btn">
                    <i class="ph ph-sign-in"></i> Giriş Yap
                </button>
            </form>

            <!-- Giriş ekranından kayıt ekranına geçiş yapmak için kullandığımız metin -->
            <p class="toggle-text" id="toggle-mode">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>

    <!-- Bildirimlerin ekranda çıkacağı kapsayıcı alan -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Sayfa ilk açıldığında giriş modu aktif olsun
        let isLoginMode = true;

        // Ekranın sağ altında beliren bildirimleri (toast) ayarlayan fonksiyon
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            // İşlemin başarılı olup olmamasına göre ikon rengi ve şekli belirliyoruz (ternary if kullanımı)
            const iconClass = type === 'success' ? 'ph-check-circle' : 'ph-warning-circle';
            const iconColor = type === 'success' ? '#10b981' : '#ef4444';

            toast.innerHTML = `<i class="ph ${iconClass}" style="color: ${iconColor}; font-size: 1.2rem;"></i> <span style="font-weight: 500;">${message}</span>`;
            container.appendChild(toast);

            // Bildirimin ekranda kalma süresini ayarlıyoruz (3 saniye sonra siliniyor)
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Form modunu "Giriş Yap" ve "Kayıt Ol" arasında değiştiren olay dinleyicisi
        document.getElementById('toggle-mode').addEventListener('click', () => {
            isLoginMode = !isLoginMode; // Değeri tersine çeviriyoruz

            // Arayüzdeki metinleri güncelliyoruz
            document.getElementById('form-title').innerText = isLoginMode ? 'Giriş Yap' : 'Kayıt Ol';
            document.getElementById('submit-btn').innerHTML = isLoginMode ? '<i class="ph ph-sign-in"></i> Giriş Yap' : '<i class="ph ph-user-plus"></i> Kayıt Ol';
            document.getElementById('toggle-mode').innerText = isLoginMode ? 'Hesabın yok mu? Kayıt Ol' : 'Zaten hesabın var mı? Giriş Yap';
        });

        // Form gönderildiğinde (submit) çalışacak asenkron fonksiyon
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            // Formun sayfayı yenilemesini engelliyoruz, bu sayede işlemler arka planda yapılıyor
            e.preventDefault();

            // Kullanıcının girdiği verileri alıyoruz
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Kullanıcının bulunduğu moda göre isteğin gideceği adresi (endpoint) belirliyoruz
            const endpoint = isLoginMode ? '/login' : '/register';

            try {
                // Fetch API ile verileri JSON formatında backend'e gönderiyoruz
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                // Backend'den dönen cevabı JSON olarak çözümlüyoruz
                const data = await res.json();

                if (data.success) {
                    showToast('Başarılı! Yönlendiriliyorsunuz...', 'success');
                    // İşlem başarılıysa kısa bir gecikme ile ana sayfaya yönlendiriyoruz
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    // Backend'den hata dönerse kullanıcıya gösteriyoruz
                    showToast(data.message || 'Bir hata oluştu', 'error');
                }
            } catch (err) {
                // Sunucuya ulaşılamazsa (örn: kapalıysa) hata veriyoruz
                showToast('Sunucuya bağlanılamadı', 'error');
            }
        });

        // Kullanıcının daha önce seçtiği tema (karanlık/aydınlık) tarayıcıda kayıtlıysa onu uyguluyoruz
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.remove('light-mode');
        }
    </script>

</body>

</html>
